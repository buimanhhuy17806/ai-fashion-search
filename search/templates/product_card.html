{% load l10n %}
<article class="group">
    <a href="{% url 'product_detail' item.id %}" class="block">
        <div class="aspect-[3/4] overflow-hidden rounded-xl bg-white ring-1 ring-line transition group-hover:ring-ink/40">
            <img src="{{ item.image_url }}" alt="{{ item.name }}" loading="lazy" class="h-full w-full object-cover">
        </div>
        <h3 class="mt-3 line-clamp-2 text-sm font-medium leading-snug">{{ item.name }}</h3>
    </a>
    <p class="mt-1 font-display text-base font-semibold">{{ item.price }}</p>
    {% if show_score and item.score is not None %}
    <div class="mt-3">
        <div class="flex items-center justify-between text-xs text-stone">
            <span>Độ tương đồng</span>
            <span class="font-medium text-ink">{{ item.score }}%</span>
        </div>
        <div class="mt-1 h-1 overflow-hidden rounded-full bg-mist">
            <div class="h-full rounded-full bg-cobalt" style="width: {{ item.score|unlocalize }}%"></div>
        </div>
    </div>
    {% endif %}
</article>
